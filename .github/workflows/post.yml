name: Post next carousel
on:
  schedule:
    - cron: "30 * * * *"   # wakes every hour; posting slots are 07:30, 12:30 and 18:30 UTC, and a late or missed wake-up is caught by the next one
  push:
    branches: [main]
    paths: ["vault/**", "accounts.json", "quotes.json"]   # a post added to the vault: just refresh the status the dashboard reads
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: run
        options: [run, post_now, write_more, pause, resume, refresh]
      account:
        description: "Account id from accounts.json, or all"
        type: string
        default: all
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACTION: ${{ github.event_name == 'push' && 'refresh' || inputs.action || 'run' }}
      ACCOUNT: ${{ inputs.account || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pause or resume
        if: env.ACTION == 'pause' || env.ACTION == 'resume'
        run: python post.py --$ACTION "$ACCOUNT"
      - name: Write new carousels
        if: env.ACTION == 'run' || env.ACTION == 'write_more'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.action == 'write_more' && '1' || '0' }}
        run: |
          if [ "$(python generate.py --need)" = "0" ]; then echo "Nothing to write (queues are full enough, or GEMINI_API_KEY is not set)."; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core fonts-dejavu-extra fonts-playfair-display || sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          fc-list > /tmp/fonts.txt
          grep -qi "Inter" /tmp/fonts.txt || { echo "::warning::Inter font missing, skipping generation"; exit 0; }
          pip install -q playwright
          python -m playwright install chromium
          python generate.py
      - name: Save new carousels
        if: always()
        continue-on-error: true
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          git add -A posts posts_* state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Add generated carousels" && git pull --rebase && git push)
      - name: Post the next item for each account
        if: env.ACTION == 'run' || env.ACTION == 'post_now'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          FORCE_POST: ${{ inputs.action == 'post_now' && '1' || '0' }}
        run: python post.py
      - name: Save what was posted
        if: always()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          python gallery.py || true
          git add state QUEUE.md status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update post record and queue page" && git pull --rebase && git push)
