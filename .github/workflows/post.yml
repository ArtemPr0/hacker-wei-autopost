name: Post next carousel
on:
  schedule:
    - cron: "30 * * * *"   # wakes every hour; posting slots are 07:30, 12:30 and 18:30 UTC, and a late or missed wake-up is caught by the next one
  push:
    branches: [main]
    paths: ["vault/**", "accounts.json", "quotes.json"]   # a post added to the vault: just refresh the status the dashboard reads
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: run
        options: [run, post_now, write_more, pause, resume, refresh, analytics]
      account:
        description: "Account id from accounts.json, or all"
        type: string
        default: all
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ACTION: ${{ github.event_name == 'push' && 'refresh' || inputs.action || 'run' }}
      ACCOUNT: ${{ inputs.account || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the newest state, never the commit the run was queued on (stale state caused the 20 Nov clash)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pause or resume
        if: env.ACTION == 'pause' || env.ACTION == 'resume'
        run: python post.py --$ACTION "$ACCOUNT"
      - name: Write new carousels
        if: env.ACTION == 'run' || env.ACTION == 'write_more'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.action == 'write_more' && '1' || '0' }}
        run: |
          if [ "$(python generate.py --need)" = "0" ]; then echo "Nothing to write (queues are full enough, or GEMINI_API_KEY is not set)."; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core fonts-dejavu-extra fonts-playfair-display || sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          fc-list > /tmp/fonts.txt
          grep -qi "Inter" /tmp/fonts.txt || { echo "::warning::Inter font missing, skipping generation"; exit 0; }
          pip install -q playwright
          python -m playwright install chromium
          python generate.py
      - name: Save new carousels
        if: always()
        continue-on-error: true
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          git add -A posts posts_* state 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Add generated carousels"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
      - name: Post the next item for each account
        if: env.ACTION == 'run' || env.ACTION == 'post_now'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
          FORCE_POST: ${{ inputs.action == 'post_now' && '1' || '0' }}
        run: |
          git pull -q --rebase origin main || true
          python post.py
      - name: Read analytics from Buffer
        if: env.ACTION == 'analytics' || env.ACTION == 'refresh' || (env.ACTION == 'run' && github.event_name == 'schedule')
        continue-on-error: true
        timeout-minutes: 8
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
        run: |
          # On timed runs, read again once the numbers are 2.5 hours old (GitHub often skips timed runs, so no fixed hours)
          if [ "$ACTION" = "run" ]; then
            AGE=$(python -c "import json,datetime as d;u=json.load(open('analytics.json'))['updated'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace('Z','+00:00'))).total_seconds()))" 2>/dev/null || echo 99999)
            if [ "$AGE" -lt 9000 ]; then echo "Analytics read $((AGE/60)) minutes ago."; exit 0; fi
          fi
          DEBUG=${{ inputs.account == 'debug' && '1' || '' }} python analytics.py
      - name: Save what was posted
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_KEY_3: ${{ secrets.BUFFER_API_KEY_3 }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          BUFFER_API_KEY_5: ${{ secrets.BUFFER_API_KEY_5 }}
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          python gallery.py || true
          git add state QUEUE.md status.json analytics.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update post record and queue page"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
