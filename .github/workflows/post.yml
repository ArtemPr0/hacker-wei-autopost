name: Post next carousel
on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC, about 17:30 in winter and 18:30 in British Summer Time
  workflow_dispatch:
    inputs:
      force_generate:
        description: "Write one new carousel now (test)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write new carousels if the queue is short
        continue-on-error: true
        timeout-minutes: 18
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.force_generate && '1' || '0' }}
        run: |
          if [ "$(python generate.py --need)" = "0" ]; then echo "Nothing to write (queue is full enough, or GEMINI_API_KEY is not set)."; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          fc-list > /tmp/fonts.txt
          grep -qi "Inter" /tmp/fonts.txt || { echo "::warning::Inter font missing, skipping generation"; exit 0; }
          pip install -q playwright
          python -m playwright install chromium
          python generate.py
      - name: Save new carousels
        if: always()
        continue-on-error: true
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          git add posts state/topics.json
          git diff --cached --quiet || (git commit -m "Add generated carousels" && git pull --rebase && git push)
      - name: Post the next carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post.py
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          if [ -f state/posted.json ]; then git add state/posted.json; fi
          git diff --cached --quiet || (git commit -m "Record posted carousel" && git pull --rebase && git push)
