name: Post next carousel
on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC, about 17:30 in winter and 18:30 in British Summer Time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the next carousel
        id: post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post.py
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "hacker-wei-bot"
          git config user.email "hacker-wei-bot@users.noreply.github.com"
          if [ -f state/posted.json ]; then git add state/posted.json; fi
          git diff --cached --quiet || (git commit -m "Record posted carousel" && git pull --rebase && git push)
